<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Blockplate</title>
  <meta name="description" content="You are a block on a huge baseplate. Walk around." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23f2c14e'/%3E%3Ccircle cx='12' cy='13' r='2' fill='%232a2418'/%3E%3Ccircle cx='20' cy='13' r='2' fill='%232a2418'/%3E%3Cpath d='M11 19 Q16 23 21 19' fill='none' stroke='%232a2418' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="view" aria-label="Blockplate"></canvas>

  <p id="hint">WASD to walk · drag to look · space to jump</p>

  <div id="pad" aria-hidden="true">
    <div class="dpad" aria-label="Move">
      <button data-dir="up" type="button" aria-label="Forward">▲</button>
      <div class="mid">
        <button data-dir="left" type="button" aria-label="Left">◀</button>
        <button data-dir="right" type="button" aria-label="Right">▶</button>
      </div>
      <button data-dir="down" type="button" aria-label="Back">▼</button>
    </div>
    <button id="jump" type="button" aria-label="Jump">Jump</button>
  </div>

  <p id="boot" class="hidden" role="alert"></p>

  <script type="module" src="game.js?v=2"></script>
</body>
</html>
