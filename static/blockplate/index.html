<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Blockplate</title>
  <meta name="description" content="Drive your car on the racetrack. You are a tall thin block in the driver's seat." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='13' y='4' width='6' height='24' rx='1' fill='%23f2c14e'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="view" aria-label="Blockplate"></canvas>

  <p id="hint">W gas · S brake · A D steer · space gets out · drag to look</p>
  <button id="enter" class="hidden" type="button">Enter vehicle <kbd>Space</kbd></button>

  <div id="pad" aria-hidden="true">
    <div class="dpad" aria-label="Move">
      <button data-dir="up" type="button" aria-label="Forward">▲</button>
      <div class="mid">
        <button data-dir="left" type="button" aria-label="Left">◀</button>
        <button data-dir="right" type="button" aria-label="Right">▶</button>
      </div>
      <button data-dir="down" type="button" aria-label="Back">▼</button>
    </div>
    <button id="jump" type="button" aria-label="Get out">Out</button>
  </div>

  <p id="boot" class="hidden" role="alert"></p>

  <script type="module" src="game.js?v=34"></script>
</body>
</html>
